# Dedicated disposable test infrastructure, separate from docker-compose.dev.yml.
# Start: docker compose -f docker-compose.test.yml up -d --wait
# Stop:  docker compose -f docker-compose.test.yml down -v
name: keel-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel_test
      POSTGRES_DB: keel_test
    ports:
      - "127.0.0.1:${KEEL_TEST_POSTGRES_PORT:-55437}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel_test"]
      interval: 1s
      timeout: 5s
      retries: 30
