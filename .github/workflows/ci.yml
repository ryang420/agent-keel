name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      # The store, bus and runner tests drop and recreate keel's tables in this throwaway database.
      - run: pytest -q tests/test_postgres_db.py tests/test_store.py tests/test_events.py tests/test_runner.py
        env:
          KEEL_TEST_POSTGRES_DSN: postgresql://keel:postgres@localhost:5432/keel_test

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: docker pull python:3.12-slim
      - run: pytest -q tests/test_docker_sandbox.py
        env:
          KEEL_TEST_DOCKER: "1"

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-keel:ci .
